services:

  postgres:
    image: postgres:16
    container_name: restaurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    # Pas de "ports" : la base ne doit être joignable que depuis les autres
    # conteneurs du réseau Docker, jamais depuis l'hôte.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: restaurant-backend
    restart: unless-stopped
    # Pas de "ports" : seul le reverse proxy (service "proxy") doit
    # atteindre le backend, via le réseau Docker interne (backend:3000).
    environment:
      DATABASE_URL: postgresql://restaurant:restaurant@postgres:5432/restaurant
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: restaurant-frontend
    restart: unless-stopped
    # Pas de "ports" non plus : le frontend n'est servi qu'à travers le
    # reverse proxy (frontend:80 en interne).
    depends_on:
      - backend

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: restaurant-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
