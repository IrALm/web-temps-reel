# Reverse proxy unique — seul point d'entrée exposé à l'extérieur.
# frontend, backend et postgres ne publient plus aucun port sur l'hôte
# (voir docker-compose.yml) ; tout transite par ce conteneur, en interne,
# via le réseau Docker (noms de service = frontend:80, backend:3000).

# Connection: upgrade géré proprement pour les WebSocket (natif et
# Socket.IO) : si le client ne demande pas d'upgrade, on retombe sur
# une connexion normale.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # --- SSE : GET /api/orders/stream ------------------------------------
    # Doit être déclaré avant le bloc /api/ général : nginx sélectionne de
    # toute façon le préfixe le plus long, mais autant rester lisible.
    # Buffering désactivé (sinon nginx retient les événements avant de les
    # transmettre) et timeout de lecture long (connexion maintenue ouverte).
    location /api/orders/stream {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # --- API REST -----------------------------------------------------
    # Le backend a lui-même le préfixe global /api (voir main.ts) : on
    # transmet le chemin tel quel, sans réécriture.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket natif (chat + commandes) ----------------------------
    location /ws/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 24h;
    }

    # --- Socket.IO ------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 24h;
    }

    # --- Frontend Angular (SPA) ------------------------------------------
    # Tout le reste : le nginx du conteneur frontend sert les fichiers
    # statiques et gère lui-même le fallback SPA (try_files ... /index.html).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
