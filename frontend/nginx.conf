server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular Router gère le routing côté client (SPA) : toute URL non
    # trouvée sur le disque (ex. /orders, /chat) doit retomber sur
    # index.html plutôt que renvoyer un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
